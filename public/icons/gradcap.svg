<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- Mortarboard top (diamond/rhombus) -->
  <polygon points="100,8 190,55 100,100 10,55" fill="#1a1a1a" stroke="#111" stroke-width="1"/>
  <!-- Shine on top -->
  <polygon points="100,8 145,32 100,55 55,32" fill="#333333"/>
  <!-- Cap body / cylinder -->
  <rect x="45" y="52" width="110" height="55" rx="4" fill="#1a1a1a"/>
  <!-- Under-brim highlight -->
  <ellipse cx="100" cy="52" rx="55" ry="10" fill="#2a2a2a"/>
  <!-- Tassel string -->
  <line x1="190" y1="55" x2="185" y2="110" stroke="#cc0000" stroke-width="4" stroke-linecap="round"/>
  <!-- Tassel knob -->
  <circle cx="185" cy="113" r="6" fill="#cc0000"/>
  <!-- Tassel fringe -->
  <line x1="182" y1="119" x2="176" y2="148" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
  <line x1="185" y1="119" x2="184" y2="150" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
  <line x1="188" y1="119" x2="192" y2="147" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
</svg>
